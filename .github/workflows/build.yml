name: Build

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: published

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      vsixPath: ${{ steps.packageExtension.outputs.vsixPath }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Package Extension
        id: packageExtension
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          pat: stub
          dryRun: true
          preRelease: ${{ github.event.release.prerelease || false }}
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Test standalone archive
        run: yarn test:standalone
      - name: Upload standalone server
        uses: actions/upload-artifact@v4
        with:
          name: nwscript-ee-standalone
          path: dist/*.tgz
      - name: Upload Extension
        uses: actions/upload-artifact@v4
        with:
          name: nwscript-ee-lsp
          path: ${{ steps.packageExtension.outputs.vsixPath }}

  publish:
    name: Publish
    needs: build
    permissions:
      contents: write
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Download Extension
        uses: actions/download-artifact@v4
        with:
          name: nwscript-ee-lsp
      - name: Download standalone server
        uses: actions/download-artifact@v4
        with:
          name: nwscript-ee-standalone
      - name: GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            # Summary
            See the [Changelog](https://github.com/PhilippeChab/nwscript-ee-language-server/blob/main/CHANGELOG.md).
          name: ${{ github.ref_name }}
          prerelease: ${{ github.event.release.prerelease }}
          fail_on_unmatched_files: true
          files: |
            ${{ needs.build.outputs.vsixPath }}
            nwscript-ee-language-server-*.tgz
      - name: Visual Studio Marketplace Release
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          pat: ${{ secrets.VS_CODE_MARKETPLACE_TOKEN }}
          extensionFile: ${{ needs.build.outputs.vsixPath }}
          registryUrl: https://marketplace.visualstudio.com
          preRelease: ${{ github.event.release.prerelease || false }}
