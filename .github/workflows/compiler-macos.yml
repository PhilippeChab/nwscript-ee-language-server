name: Build macOS compiler

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/compiler-macos.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v5
        with:
          repository: niv/neverwinter.nim
          ref: 369fdc4186f19d3668f05b44f9b98d32ea5233c4 # 2.3.1
      - name: Install pinned Nim toolchain
        run: |
          curl --fail --location --output nim.tar.xz https://nim-lang.org/download/nim-2.2.10-macosx_x64.tar.xz
          echo "35df59b9bbe9f5dfcdf40a82b41037e6ac499e2ec0be6688cd3dd0e55c8bc851  nim.tar.xz" | shasum -a 256 -c -
          tar -xf nim.tar.xz
          echo "$PWD/nim-2.2.10/bin" >> "$GITHUB_PATH"
      - name: Build Intel compiler
        run: nimble build -y -d:release --backend:cpp nwn_script_comp
      - name: Combine with upstream Apple Silicon compiler
        run: |
          curl --fail --location --output arm64.zip https://github.com/niv/neverwinter.nim/releases/download/2.3.1/neverwinter-aarch64-macos.zip
          mkdir arm64
          unzip arm64.zip nwn_script_comp -d arm64
          lipo -create bin/nwn_script_comp arm64/nwn_script_comp -output nwn_script_comp
          chmod +x nwn_script_comp
          ./nwn_script_comp --version
          ./nwn_script_comp --help | grep -- --no-require-entry-point
          lipo -info nwn_script_comp
          otool -L nwn_script_comp
          tar -czf nwn_script_comp-macos.tar.gz nwn_script_comp
      - uses: actions/upload-artifact@v4
        with:
          name: nwn_script_comp-macos
          path: nwn_script_comp-macos.tar.gz
